      (function () {
        try {
          var desc = Object.getOwnPropertyDescriptor(window, 'fetch') ||
                     Object.getOwnPropertyDescriptor(Window.prototype, 'fetch');
          var currentFetch = window.fetch ? window.fetch.bind(window) : undefined;
          if (desc && !desc.writable && !desc.set) {
            Object.defineProperty(window, 'fetch', {
              configurable: true,
              enumerable: true,
              get: function () {
                return currentFetch;
              },
              set: function (fn) {
                if (typeof fn === 'function') {
                  currentFetch = fn;
                }
              }
            });
          }
        } catch (_) {}
        window.addEventListener(
          'error',
          function (e) {
            var filename = (e && e.filename) || '';
            var msg = (e && e.message) || '';

              filename.indexOf('chrome-extension://') === 0 ||
              msg.indexOf('Cannot set property fetch') !== -1
            ) {
              e.stopImmediatePropagation();
              e.preventDefault();
            }
          },
          true

    <script>
      (function () {
        function isInsideZoomable(target) {
          return (
            target &&
            typeof target.closest === 'function' &&
            Boolean(target.closest('[data-allow-zoom="true"]'))
          );
        }

        // Prevent multi-touch browser page pinch-zoom everywhere;
        // inside [data-allow-zoom="true"] (e.g. PosterLightbox), touchstart is allowed
        // so React receives 2-finger pinch events, while native browser zoom is still blocked on touchmove.
        document.addEventListener(
          'touchstart',
          function (e) {
            if (e.touches && e.touches.length > 1 && !isInsideZoomable(e.target)) {
              if (e.cancelable) e.preventDefault();
            }
          },
          { passive: false, capture: true }
        );

        document.addEventListener(
          'touchmove',
          function (e) {
            if (e.touches && e.touches.length > 1 && !isInsideZoomable(e.target)) {
              if (e.cancelable) e.preventDefault();
            }
          },
          { passive: false, capture: true }
        );

        // Prevent iOS Safari / WebKit native gesture zoom on pages
        ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (evtName) {
          document.addEventListener(
            evtName,
            function (e) {
              if (!isInsideZoomable(e.target) && e.cancelable) {
                e.preventDefault();
              }
            },
            { passive: false, capture: true }
          );
        });

        // Prevent double-tap browser page zoom outside zoomable poster viewers
        var lastTouchEnd = 0;
        document.addEventListener(
          'touchend',
          function (e) {
            if (isInsideZoomable(e.target)) return;
            var now = Date.now();
            if (now - lastTouchEnd <= 300 && (!e.touches || e.touches.length === 0)) {
              // Do not preventDefault on interactive controls so fast taps still click
              var isInteractive =
                e.target &&
                typeof e.target.closest === 'function' &&
                e.target.closest('button, a, input, textarea, select, [role="button"]');
              if (!isInteractive && e.cancelable) {
                e.preventDefault();
              }
            }
            lastTouchEnd = now;
          },
          { passive: false }
        );
      })();
    </script>
